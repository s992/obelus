query GetBooksByIds($ids: [Int!]) {
  books(where: { id: { _in: $ids } }) {
    id
    title
    subtitle
    description
    release_date
    image {
      url
      width
      height
    }
    featured_book_series {
      series {
        id
        name
        books_count
      }
      position
    }
    pages
    contributions(limit: 1) {
      author {
        name
      }
    }
  }
}
