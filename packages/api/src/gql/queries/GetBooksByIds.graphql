query GetBooksByIds($ids: [Int!]) {
  books(
    where: {
      id: { _in: $ids }
      canonical_id: { _is_null: true }
      book_status_id: { _eq: 1 }
      is_partial_book: { _eq: false }
    }
  ) {
    id
    title
    subtitle
    description
    release_date
    image {
      url
      width
      height
    }
    featured_book_series {
      series {
        id
        name
        books_count
      }
      position
    }
    pages
    contributions {
      contribution
      author {
        name
      }
    }
  }
}
