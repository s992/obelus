services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: obelus
      POSTGRES_PASSWORD: obelus
      POSTGRES_DB: obelus
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U obelus']
      interval: 2s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    image: ghcr.io/s992/obelus:latest
    env_file: ${ENV_FILE:-.env}
    entrypoint: ['node', '/app/api/dist/migrate.cjs']
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: .
    image: ghcr.io/s992/obelus:latest
    ports:
      - '80:80'
    env_file: ${ENV_FILE:-.env}
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1/api/readyz || exit 1']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  pgdata:
